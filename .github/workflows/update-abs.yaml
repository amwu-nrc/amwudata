name: update-data
on:
  push:
    branches: [main, master]
    paths:
      - "data-raw/**"
      - ".github/**"
  schedule:
      - cron: '45 0 * * 1-5'
jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
        GITHUB_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: renv
      - uses: r-lib/actions/setup-renv@v2
          
      - name: Update data
        run: |
          Rscript -e "source('data-raw/update_abs.R')"
      - name: Commit new data and Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: Scheduled data update
          committer: Hamish Gamble <hamish.gamble@amwu.org.au>
          title: "Scheduled data updates"
          labels: automated pr
          branch: data-updates


